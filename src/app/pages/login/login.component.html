<main class="auth">
  <div class="auth__card">
    <h1>🌱 EcoScan</h1>
    <p class="subtitulo">Toma una foto de un residuo y descubre cómo reciclarlo.</p>

    <label for="email">Correo</label>
    <input id="email" type="email" [(ngModel)]="email" placeholder="tucorreo@demo.com" />

    <label for="password">Contraseña</label>
    <input id="password" type="password" [(ngModel)]="password" placeholder="••••••••" />

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button (click)="ingresar()" [disabled]="cargando || !email || !password">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="link-registro">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>

    <div class="demo">
      <p>Demo rápida (correo <code>luis&#64;demo.com</code>, contraseña <code>demo123</code>):</p>
      <button class="secundario" (click)="usarDemo()">Entrar con cuenta demo</button>
    </div>
  </div>
</main>
